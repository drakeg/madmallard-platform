name: Validate
on:
  push:
  pull_request:
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose syntax
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate Compose services
        run: |
          cp .env.example .env
          docker compose config --services | sort > actual.txt
          printf 'mariadb\nmatomo\nmetabase\nn8n\npostgres\nredis\n' > expected.txt
          diff -u expected.txt actual.txt
