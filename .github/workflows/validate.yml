name: Validate
on:
  push:
  pull_request:
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose syntax
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate Compose services
        run: |
          cp .env.example .env
          docker compose config --services | sort > actual.txt
          printf 'chatwoot\nchatwoot-worker\nhorilla\nmariadb\nmatomo\nmetabase\nn8n\npostgres\nredis\n' > expected.txt
          diff -u expected.txt actual.txt
      - name: Prevent removed analytics service from returning
        run: |
          removed_service="uma""mi"
          if docker compose config --services | grep -Fxq "$removed_service"; then
            echo 'Removed analytics service must not be reintroduced' >&2
            exit 1
          fi
          if grep -R -i "$removed_service" compose.yaml .env.example .github/workflows scripts README.md docs; then
            echo 'Removed analytics integration reference detected' >&2
            exit 1
          fi
