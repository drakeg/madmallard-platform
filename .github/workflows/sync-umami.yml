name: Sync Umami fork image
on:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '15 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: umami-fork-image
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest Umami fork
        uses: actions/checkout@v4
        with:
          repository: drakeg/umami
          ref: master
          path: umami
          fetch-depth: 1
      - name: Resolve source commit
        id: source
        run: echo "sha=$(git -C umami rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish fork image
        uses: docker/build-push-action@v7
        with:
          context: ./umami
          push: true
          tags: |
            ghcr.io/drakeg/madmallard-umami:edge
            ghcr.io/drakeg/madmallard-umami:${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/drakeg/umami
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
      - name: Summarize built image
        run: |
          echo "Umami source commit: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ghcr.io/drakeg/madmallard-umami:${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
