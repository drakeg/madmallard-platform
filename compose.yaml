name: ${COMPOSE_PROJECT_NAME:-madmallard}
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: platform
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d platform"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.8}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: ${MARIADB_MATOMO_PASSWORD:?Set MARIADB_MATOMO_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  redis:
    image: ${REDIS_IMAGE:-redis:7.4}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  matomo:
    image: ${MATOMO_IMAGE:-matomo:5-apache}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: mariadb
      MATOMO_DATABASE_ADAPTER: MYSQLI
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: ${MARIADB_MATOMO_PASSWORD:?Set MARIADB_MATOMO_PASSWORD}
      MATOMO_DATABASE_DBNAME: matomo
      TZ: ${TZ:-UTC}
    volumes:
      - matomo_data:/var/www/html
    ports:
      - "${MATOMO_BIND_IP:-127.0.0.1}:${MATOMO_PORT:-8088}:80"
    networks: [backend, frontend]
  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD}
      MB_DB_HOST: postgres
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_SECRET_KEY:?Set METABASE_ENCRYPTION_SECRET_KEY}
      JAVA_TIMEZONE: ${TZ:-UTC}
    ports:
      - "${METABASE_BIND_IP:-127.0.0.1}:${METABASE_PORT:-3001}:3000"
    networks: [backend, frontend]
networks:
  backend:
    internal: true
  frontend:
volumes:
  postgres_data:
  mariadb_data:
  redis_data:
  matomo_data:
